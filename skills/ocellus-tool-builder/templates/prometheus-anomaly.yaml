# Template: one range query ending at `at`, point anomalies per series against its
# own history (anomaly/iqr) with a significance threshold in metric units
# (min_delta), level-2 answer. Load per core (node_exporter). Adapt: the metric,
# the unit of min_delta and its default, the fields.
name: node_load_anomalies
description: |
  Load anomalies per host (node_exporter load1 divided by the number of CPU
  cores) over the `range` ending at `at`: samples outside the Tukey (IQR)
  fences of the host's own history in that window that also differ from its
  median by at least `min_delta` (load per core). Returns how many hosts were
  analysed and, for hosts with anomalies, the count, the typical (median)
  load per core, the fences and the strongest anomalies with time, value,
  direction (up/down) and score. An empty answer means nothing larger than
  `min_delta`, not that the load never moved. `instance` narrows the hosts
  by regex. Use it to find hosts whose load jumped or dropped unusually.
worker: prometheus

params:
  instance:    {type: string, default: ".*", description: "Regex over the instance label, e.g. web-.*"}
  at:          {type: string, default: "now", description: "End of the window: now, now-<duration> such as now-3d, or an RFC3339 time", pattern: "^(now(-[0-9]+[smhdwy])?|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2}))$"}
  range:       {type: string, default: "6h", description: "Look-back range ending at `at`, e.g. 2h, 1d", pattern: "^[0-9]+[smhdwy]$"}
  step:        {type: string, default: "60s", description: "Sample resolution such as 30s, 5m", pattern: "^[0-9]+[smhdwy]$"}
  sensitivity: {type: number, default: 3, minimum: 0.1, maximum: 10, description: "IQR fence multiplier k: 1.5 = standard outliers, 3 = only extreme ones"}
  direction:   {type: string, default: "up", enum: [both, up, down], description: "Which deviations to report: up (load jumps), down, both"}
  min_delta:   {type: number, default: 0.25, minimum: 0, maximum: 100, description: "Smallest deviation from the host's median worth reporting, load per core (0.25 = a quarter of a core)"}
  top:         {type: integer, default: 10, minimum: 1, maximum: 200, description: "How many hosts to list, most anomalous first"}

request:
  type: range
  query: |
    node_load1{instance=~{{ promLabel .instance }}}
      / on (instance) group_left () count by (instance) (node_cpu_seconds_total{mode="idle", instance=~{{ promLabel .instance }}})
  start: '{{ if eq .at "now" }}now-{{ promDuration .range }}{{ else if hasPrefix "now-" .at }}now-{{ add (promDurationSeconds (trimPrefix "now-" .at)) (promDurationSeconds .range) }}s{{ else }}{{ (toDate "2006-01-02T15:04:05Z07:00" .at | dateModify (printf "-%ds" (promDurationSeconds .range))).Unix }}{{ end }}'
  end: "{{ .at }}"
  step: "{{ .step }}"

process:
  - fn: anomaly
    with:
      method: iqr
      k: "{{ .sensitivity }}"
      direction: "{{ .direction }}"
      min_points: 30
      min_delta: "{{ .min_delta }}"   # load per core from the median, applied before the cap
      max_anomalies: 3                # the three strongest per host, in time order

response:
  jq: |
    [ .series[] | select(.skipped | not) | select(.anomaly_count > 0)
      | {instance: .metric.instance, count: .anomaly_count,
         median: .stats.median, lower: .stats.lower, upper: .stats.upper, max: .stats.max,
         anomalies: (.anomalies | map({time, value, direction, score}))}
    ] as $hosts
    | {
        at: $params.at, range: $params.range,
        analyzed: .series_analyzed, skipped: .series_skipped,
        raw_total: (.total_anomalies + ([.series[].below_min_delta // 0] | add // 0)),
        total: .total_anomalies,
        with_anomalies: ($hosts | length),
        hosts: ($hosts | sort_by(-.count, -.max) | .[:$params.top])
      }
  render: |
    {{ if eq (int .total) 0 }}No load anomalies among {{ .analyzed }} host(s) matching {{ param "instance" }} over the {{ param "range" }} ending at {{ .at }} (IQR k={{ param "sensitivity" }}, direction {{ param "direction" }}, deviations under {{ param "min_delta" }} load per core ignored: {{ .raw_total }} raw{{ if .skipped }}; {{ .skipped }} host(s) skipped for lack of samples{{ end }}).{{ else -}}
    {{ .total }} anomalous load sample(s) on {{ .with_anomalies }} of {{ .analyzed }} host(s) over the {{ param "range" }} ending at {{ .at }} (IQR k={{ param "sensitivity" }}, direction {{ param "direction" }}, deviations under {{ param "min_delta" }} ignored: {{ .raw_total }} raw; {{ .skipped }} skipped). Top {{ len .hosts }}:
    {{ range .hosts }}{{ .instance }}: {{ .count }} anomaly(ies), typical {{ printf "%.2f" (float64 .median) }} per core, fences {{ printf "%.2f" (float64 .lower) }}..{{ printf "%.2f" (float64 .upper) }}
    {{ range .anomalies }}  - {{ .time }} {{ .direction }} to {{ printf "%.2f" (float64 .value) }} (score {{ printf "%.1f" (float64 .score) }})
    {{ end }}{{ end }}{{ end }}
