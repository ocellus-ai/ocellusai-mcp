# calls: example — two sequential worker calls joined in jq. The first call
# lists the pods with kubectl and shapes its output with a per-call jq; the
# second builds a PromQL query from that output through `result "pods"`;
# response.jq receives {pods: ..., cpu: ...} and joins both by pod name.
name: pods_cpu_status
description: |
  Kubernetes status (phase, restarts, node) together with the current CPU
  usage in cores for the pods of a namespace, optionally filtered by a label
  selector. Lists the pods with kubectl, then queries Prometheus for exactly
  those pods over the last `window` and joins both by pod name. Returns
  [{"pod","phase","restarts","node","cores"}] sorted by cores, highest first.
  Use it to correlate load with pod health in one call.

params:
  namespace: {type: string, required: true, description: "Kubernetes namespace"}
  selector:  {type: string, default: "", description: "Label selector such as app=api (empty = all pods)"}
  window:    {type: string, default: "5m", description: "Rate window such as 5m or 1h", pattern: "^[0-9]+[smhdwy]$"}

calls:
  - name: pods
    worker: shell
    request:
      command: kubectl
      args: [get, pods, -n, "{{ .namespace }}", -l, "{{ .selector }}", -o, json]
      parse: json
      timeout: 20s
    jq: |
      [.items[] | {
        pod: .metadata.name,
        phase: .status.phase,
        node: (.spec.nodeName // "-"),
        restarts: ([.status.containerStatuses[]?.restartCount] | add // 0)
      }]
  - name: cpu
    worker: prometheus
    request:
      type: instant
      # Pod names from the first call become one anchored regex; an empty list
      # matches nothing instead of every pod. promRegex escapes each name,
      # promLabel quotes the whole value for PromQL.
      query: |
        {{- $names := list }}{{ range result "pods" }}{{ $names = append $names (promRegex .pod) }}{{ end -}}
        sum by (pod) (rate(container_cpu_usage_seconds_total{
          namespace={{ promLabel .namespace }},
          pod=~{{ promLabel (join "|" $names | default "__none__") }},
          container!=""
        }[{{ promDuration .window }}]))

response:
  jq: |
    (.cpu.result | map({key: .metric.pod, value: (.value[1] | tonumber)}) | from_entries) as $cpu
    | [.pods[] | . + {cores: ($cpu[.pod] // 0)}]
    | sort_by(-.cores)
  render: |
    {{ if not . }}No pods in namespace {{ param "namespace" }}{{ with param "selector" }} matching {{ . }}{{ end }}.{{ else }}
    {{ len . }} pod(s) in {{ param "namespace" }}{{ with param "selector" }} matching {{ . }}{{ end }}, CPU over the last {{ param "window" }}:
    {{ range . }}{{ .pod }}: {{ .phase }}, {{ .restarts }} restart(s), node {{ .node }}, {{ printf "%.3f" (float64 .cores) }} cores
    {{ end }}{{ end }}
