# ocellusai-mcp configuration filled from the environment: every ${VAR} is
# replaced with the value of that variable at startup. An unset variable is a
# startup error that lists all missing names; there are no defaults.
#
# Use this file where settings come from the environment (a Helm chart,
# docker run -e ...); for a local run with the values written in place see
# config.rest.example.yaml.
#
#   MCP_TRANSPORT=http MCP_LISTEN=:8080 MCP_TOOLS_DIR=./tools \
#   MCP_PROMETHEUS_URL=http://localhost:9090 MCP_PROMETHEUS_TIMEOUT=15s \
#   MCP_ALERTMANAGER_URL=http://localhost:9093/api/v2 \
#   MCP_LOG_LEVEL=info MCP_LOG_FORMAT=json \
#   ./bin/ocellusai-mcp -config config.rest.env.yaml
#
# ${VAR} works in any value, also inside a string ("Bearer ${TOKEN}"); inside
# [...] or {...} put it in quotes. A list cannot come from one variable, so
# allowlist is written here directly.

server:
  transport: ${MCP_TRANSPORT}        # stdio | http
  listen: ${MCP_LISTEN}              # e.g. :8080; the MCP endpoint is /mcp, health is /healthz

tools_dir: ${MCP_TOOLS_DIR}          # directory with the tool YAML files

workers:
  prometheus:
    url: ${MCP_PROMETHEUS_URL}
    timeout: ${MCP_PROMETHEUS_TIMEOUT}   # e.g. 15s
    # Uncomment when Prometheus needs a token; MCP_PROMETHEUS_TOKEN then becomes required:
    # headers:
    #   Authorization: "Bearer ${MCP_PROMETHEUS_TOKEN}"
  shell:
    allowlist: [df, dig]             # every command a tool uses must be listed
    timeout: 30s
    max_output_bytes: 1048576
    env: {}
  rest:
    url: ${MCP_ALERTMANAGER_URL}     # Alertmanager API v2 base URL for tools-test/alertmanager_*
    timeout: 15s
    max_response_bytes: 1048576
    # Uncomment when Alertmanager needs a token; MCP_ALERTMANAGER_TOKEN then becomes required:
    # headers:
    #   Authorization: "Bearer ${MCP_ALERTMANAGER_TOKEN}"

log:
  level: ${MCP_LOG_LEVEL}            # debug | info | warn | error
  format: ${MCP_LOG_FORMAT}          # json | text
