# Template: one instant query at a moment, top-N, level-2 answer (text + structured).
# Top hosts by memory use (node_exporter). Adapt: the metric, the filter labels
# (add job="..." for your setup), the fields and the units.
name: node_memory_top
description: |
  Hosts with the highest memory use (node_exporter) at time `at`: used % of
  total memory (MemTotal minus MemAvailable), with used and total bytes.
  Returns the `top` hosts, highest use first, plus how many hosts matched.
  `instance` is a regex over the instance label. An empty answer means no
  host matched the filter at that time (not that memory is fine). Use it for
  a quick memory overview of a fleet; for one host's history use an anomaly
  or time-series tool.
worker: prometheus

params:
  instance: {type: string, default: ".*", description: "Regex over the instance label, e.g. web-.* or db-0[1-3].*"}
  at:       {type: string, default: "now", description: "Evaluation time: now, now-<duration> such as now-3d, or an RFC3339 time", pattern: "^(now(-[0-9]+[smhdwy])?|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2}))$"}
  top:      {type: integer, default: 10, minimum: 1, maximum: 100, description: "How many hosts to return"}

request:
  type: instant
  time: "{{ .at }}"
  query: |
    {{- $sel := printf "instance=~%s" (promLabel .instance) -}}
    label_replace(
      100 * (1 - node_memory_MemAvailable_bytes{ {{ $sel }} } / (node_memory_MemTotal_bytes{ {{ $sel }} } > 0)),
      "stat", "used_pct", "", "")
    or label_replace(node_memory_MemTotal_bytes{ {{ $sel }} } - node_memory_MemAvailable_bytes{ {{ $sel }} }, "stat", "used_bytes", "", "")
    or label_replace(node_memory_MemTotal_bytes{ {{ $sel }} }, "stat", "total_bytes", "", "")

response:
  jq: |
    [ .result
      | group_by(.metric.instance)[]
      | (map({key: .metric.stat, value: (.value[1] | tonumber? // null)}) | from_entries) as $s
      | {instance: .[0].metric.instance, used_pct: $s.used_pct, used_bytes: $s.used_bytes, total_bytes: $s.total_bytes}
    ] as $hosts
    | {
        at: $params.at,
        matched: ($hosts | length),
        hosts: ($hosts | sort_by(-(.used_pct // -1)) | .[:$params.top])
      }
  render: |
    {{- define "bytes" }}{{ if kindIs "invalid" . }}n/a{{ else }}{{ $v := float64 . }}{{ if ge $v 1073741824.0 }}{{ printf "%.1f GiB" (divf $v 1073741824.0) }}{{ else }}{{ printf "%.0f MiB" (divf $v 1048576.0) }}{{ end }}{{ end }}{{ end }}
    {{- define "pct" }}{{ if kindIs "invalid" . }}n/a{{ else }}{{ printf "%.1f%%" (float64 .) }}{{ end }}{{ end -}}
    {{ if eq (int .matched) 0 }}No hosts matching {{ param "instance" }} reported memory at {{ .at }}.{{ else -}}
    Top {{ len .hosts }} of {{ .matched }} host(s) by memory use at {{ .at }}:
    {{ range .hosts }}- {{ .instance }}: {{ template "pct" .used_pct }} used ({{ template "bytes" .used_bytes }} of {{ template "bytes" .total_bytes }})
    {{ end }}{{ end }}
