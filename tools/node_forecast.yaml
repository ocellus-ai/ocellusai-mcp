# The forecast of one node_exporter signal per VM over an interval the agent
# chooses (processor ssa), summarised instead of 288 points per day: level,
# ends, extremes with their times, a coarse profile in a fixed number of
# buckets, time above a threshold, the noise the actual values will add, the
# scheduled jobs SSA leaves out, and how far to trust it. The history
# defaults are those of node_ssa.
# Assumes node_exporter scraped as job="node_exporters"; adjust the selectors
# to your setup.
name: node_forecast
description: |
  Forecasts one signal of each virtual machine (node_exporter) by Singular
  Spectrum Analysis of the `range` of history ending at `at`, and summarises
  the forecast over the interval `from`..`to`: each is a duration after `at`
  (0s, 5h, 1d4h) or an RFC3339 time (2030-01-15T09:00:00Z), so "tomorrow
  09:00-18:00" and "the next 6 hours" are both one call; the forecast runs
  from `at` to `to` and only the interval is summarised. Per VM: the mean,
  the values at the start and the end, the minimum and the maximum with their
  times, a profile of `buckets` equal parts of the interval (their means),
  and with `above` how long the forecast stays above that value in total, when
  it first crosses it and its longest stretch above. The forecast is the
  smooth expected structure (trend, daily cycle and harmonics): the actual
  values scatter around it by about the noise sigma given, it has no
  confidence band, and it leaves out the scheduled jobs that recur daily at one
  time of day - those falling into the interval are listed with their usual
  size. Trust: a VM whose history holds another regime (an outage, a
  catch-up; listed with UTC times) or whose forecast is unstable comes last
  with the reason; re-run with `at`/`range` outside such stretches. Signals:
  cpu (busy %, includes iowait and steal), iowait %, steal %, mem (used %),
  disk (busiest device utilisation %), net_rx / net_tx (Mbit/s), load (load1
  per core), tcp (established connections). VMs are listed by the time above
  `above` (or the interval maximum without it), trusted ones first.
params:
  instance: {type: string, default: ".*", description: "Regex over the instance label, e.g. web-.*"}
  signal:   {type: string, default: "cpu", enum: ["cpu", "iowait", "steal", "mem", "disk", "net_rx", "net_tx", "load", "tcp"], description: "Which node_exporter signal to forecast"}
  at:       {type: string, default: "now", description: "End of the history, where the forecast starts: now, now-<duration> such as now-3d, or an RFC3339 time", pattern: "^(now(-[0-9]+[smhdwy])?|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2}))$"}
  from:     {type: string, default: "0s", description: "Start of the interval to summarise: a duration after `at` (0s, 5h, 1d4h) or an RFC3339 time; a start before the forecast begins is moved to it", pattern: "^(([0-9]+[smhdwy])+|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2}))$"}
  to:       {type: string, default: "1d", description: "End of the interval, after `at` and `from`: a duration after `at` (6h, 1d, 2d) or an RFC3339 time; the forecast runs to it. Far ends are less reliable, a day or two is the useful range", pattern: "^(([0-9]+[smhdwy])+|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2}))$"}
  above:    {type: number, description: "Threshold in the signal's units (cpu 80 = 80%, net_rx 500 = 500 Mbit/s): how long the forecast stays above it within the interval, when it first crosses it, its longest stretch above. Optional"}
  buckets:  {type: integer, default: 12, minimum: 1, maximum: 48, description: "How many equal parts of the interval the profile shows (12 over a day = 2-hour means)"}
  range:    {type: string, default: "4d", description: "History ending at `at`, at least three periods of the main cycle, e.g. 4d or 3d12h", pattern: "^([0-9]+[smhdwy])+$"}
  step:     {type: string, default: "5m", description: "Sample resolution such as 1m, 5m", pattern: "^[0-9]+[smhdwy]$"}
  window:   {type: string, default: "1d", description: "SSA window, a multiple of the main period (1d for a daily cycle)", pattern: "^([0-9]+[smhdwy])+$"}
  method:   {type: string, default: "L", enum: ["L", "K"], description: "Forecast method: L recurrent (default), K vector"}
  groups:   {type: string, default: "", pattern: "^[0-9,; -]*$", description: "Components to forecast, e.g. 0;1-2 (numbers from node_ssa; default: the trend, slow cycles and harmonic pairs above the noise)"}
  top:      {type: integer, default: 10, minimum: 1, maximum: 200, description: "How many VMs to list"}

worker: prometheus
request:
  type: range
  query: |
    {{- if eq .signal "cpu" -}}
    100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle", job="node_exporters", instance=~{{ promLabel .instance }}}[5m])))
    {{- else if eq .signal "iowait" -}}
    100 * avg by (instance) (rate(node_cpu_seconds_total{mode="iowait", job="node_exporters", instance=~{{ promLabel .instance }}}[5m]))
    {{- else if eq .signal "steal" -}}
    100 * avg by (instance) (rate(node_cpu_seconds_total{mode="steal", job="node_exporters", instance=~{{ promLabel .instance }}}[5m]))
    {{- else if eq .signal "mem" -}}
    max by (instance) (100 * (1 - node_memory_MemAvailable_bytes{job="node_exporters", instance=~{{ promLabel .instance }}}
                                / node_memory_MemTotal_bytes{job="node_exporters", instance=~{{ promLabel .instance }}}))
    {{- else if eq .signal "disk" -}}
    clamp_max(100 * max by (instance) (rate(node_disk_io_time_seconds_total{job="node_exporters", instance=~{{ promLabel .instance }}, device=~"(sd|vd|xvd|nvme|dm-|md).*"}[5m])), 100)
    {{- else if eq .signal "net_rx" -}}
    8 * sum by (instance) (rate(node_network_receive_bytes_total{job="node_exporters", instance=~{{ promLabel .instance }}, device!~"lo|veth.*|docker.*|br.*|virbr.*|cali.*|flannel.*|cilium.*|lxc.*"}[5m])) / 1e6
    {{- else if eq .signal "net_tx" -}}
    8 * sum by (instance) (rate(node_network_transmit_bytes_total{job="node_exporters", instance=~{{ promLabel .instance }}, device!~"lo|veth.*|docker.*|br.*|virbr.*|cali.*|flannel.*|cilium.*|lxc.*"}[5m])) / 1e6
    {{- else if eq .signal "load" -}}
    max by (instance) (node_load1{job="node_exporters", instance=~{{ promLabel .instance }}})
      / count by (instance) (node_cpu_seconds_total{mode="idle", job="node_exporters", instance=~{{ promLabel .instance }}})
    {{- else -}}
    max by (instance) (node_netstat_Tcp_CurrEstab{job="node_exporters", instance=~{{ promLabel .instance }}})
    {{- end }}
  start: '{{ if eq .at "now" }}now-{{ promDuration .range }}{{ else if hasPrefix "now-" .at }}now-{{ add (promDurationSeconds (trimPrefix "now-" .at)) (promDurationSeconds .range) }}s{{ else }}{{ (toDate "2006-01-02T15:04:05Z07:00" .at | dateModify (printf "-%ds" (promDurationSeconds .range))).Unix }}{{ end }}'
  end: "{{ .at }}"
  step: "{{ .step }}"

process:
  - fn: ssa
    with:
      window: "{{ .window }}"
      # the horizon is `to` after `at`: the duration itself, or the RFC3339 time minus `at`
      forecast: '{{ $at := 0 }}{{ if eq .at "now" }}{{ $at = now | unixEpoch }}{{ else if hasPrefix "now-" .at }}{{ $at = sub (now | unixEpoch) (promDurationSeconds (trimPrefix "now-" .at)) }}{{ else }}{{ $at = (toDate "2006-01-02T15:04:05Z07:00" .at).Unix }}{{ end }}{{ $h := 0 }}{{ if regexMatch "^([0-9]+[smhdwy])+$" .to }}{{ $h = promDurationSeconds .to }}{{ else }}{{ $h = sub (toDate "2006-01-02T15:04:05Z07:00" .to).Unix $at }}{{ end }}{{ if le (int64 $h) 0 }}{{ fail (printf "to %s is not after at %s" .to .at) }}{{ end }}{{ $h }}s'
      method: "{{ .method }}"
      groups: "{{ .groups }}"
      clip: '{{ if has .signal (list "cpu" "iowait" "steal" "mem" "disk") }}0,100{{ else }}0,1e15{{ end }}'
      min_points: 288                # at least a day of 5m samples
      # as in node_ssa: the smallest stretch away from the usual daily profile worth reporting
      min_delta: '{{ get (dict "cpu" 5 "iowait" 1 "steal" 1 "mem" 3 "disk" 10 "net_rx" 5 "net_tx" 5 "load" 0.25 "tcp" 20) .signal }}'
      min_rel_delta: 0.2

response:
  jq: |
    def dur: [scan("([0-9]+)([smhdwy])") | (.[0] | tonumber) * {"s": 1, "m": 60, "h": 3600, "d": 86400, "w": 604800, "y": 31536000}[.[1]]] | add // 0;
    def instant: if . == "now" then now elif startswith("now-") then now - (.[4:] | dur) else fromdateiso8601 end;
    def moment($at): if test("^([0-9]+[smhdwy])+$") then $at + dur else fromdateiso8601 end;
    def hm: (. / 60 | round) as $m
      | if $m >= 1440 then "\($m / 1440 | floor)d\((($m % 1440) / 60 | floor) as $h | if $h > 0 then "\($h)h" else "" end)"
        elif $m >= 60 then "\($m / 60 | floor)h\(if $m % 60 > 0 then "\($m % 60)m" else "" end)"
        else "\($m)m" end;
    def clock: strftime("%m-%d %H:%M");
    # times inside the interval: without the date when it lies within one day
    def clk($oneday): if $oneday then strftime("%H:%M") else clock end;
    def sig: if . == 0 then 0 else (fabs | log10 | floor) as $e | pow(10; 2 - $e) as $f | (. * $f | round) / $f end;
    ($params.at | instant) as $at
    | ($params.from | moment($at)) as $from
    | ($params.to | moment($at)) as $to
    | if $to <= $from then error("to (\($params.to)) must be after from (\($params.from))") else . end
    | $params.above as $thr
    | ((([$from, $at] | max) / 86400 | floor) == ($to / 86400 | floor)) as $oneday
    | (if $thr == null then {} else {threshold: $thr} end) + {
        from: ([$from, $at] | max | clock), to: ($to | clock),
        analyzed: .series_analyzed,
        skipped: [ .series[] | select(.skipped) | {instance: .labels.instance, reason} ],
        vms: [ .series[] | select(.skipped | not) | . as $s | .step as $step
               | [ (.forecast.points // [])[] | select(.[0] >= $from and .[0] <= $to) ] as $p
               | {instance: .labels.instance, noise_sd: .noise.sd,
                  off_share: ((.residual.spikes // 0) / .grid_points),
                  broken,
                  regime: [ .runs[] | select(.kind == "long")
                            | "\(.start | clock)..\(.end | clock) \(if .deviation < 0 then "below" else "above" end) by \(.deviation | fabs | sig) (\(.duration | hm))" ],
                  forecast_of: .forecast.group, left_out: [ (.forecast.left_out // [])[] as $c | select([ (.forecast.growing // [])[].components[] ] | any(. == $c) | not) | $c ], growing: [ (.forecast.growing // [])[] | "\(.group) (period \(.period_seconds / 3600 * 10 | round / 10) h, x\(.growth * 10 | round / 10) over the horizon)" ], warning: (.forecast.warning // "")}
               + if ($p | length) == 0 then
                   {reason: (.forecast.reason // "the forecast has no point in the interval")}
                 else
                   # buckets of equal time, a whole number of steps; the last point joins the last bucket
                   ([((($p[-1][0] - $p[0][0] + $step) / $params.buckets / $step) | round), 1] | max * $step) as $width
                   | {
                       points: ($p | length),
                       mean: ($p | map(.[1]) | add / length),
                       first: $p[0][1], last: $p[-1][1],
                       min: ($p | min_by(.[1]) | {value: .[1], time: (.[0] | clk($oneday))}),
                       max: ($p | max_by(.[1]) | {value: .[1], time: (.[0] | clk($oneday))}),
                       bucket: ($width | hm),
                       profile: [ $p | group_by([((.[0] - $p[0][0]) / $width | floor), $params.buckets - 1] | min)[]
                                  | {time: (.[0][0] | clk($oneday)), mean: (map(.[1]) | add / length)} ],
                       jobs: [ $s.recurring[] | . as $r
                               | [ range(($from / 86400 | floor) - 1; ($to / 86400 | floor) + 1) | . * 86400 + $r.seconds_of_day
                                   | select(. >= $from and . <= $to) | clock ] as $when
                               | select($when | length > 0)
                               | {at: $when, time_of_day, spread: (.spread | hm), duration: (.duration | hm), deviation, days, of_days} ]
                     }
                   + if $thr == null then {} else
                       (reduce $p[] as $q ([];
                          if $q[1] > $thr then
                            (if length > 0 and .[-1].open then .[-1].to = $q[0] else . + [{from: $q[0], to: $q[0], open: true}] end)
                          elif length > 0 then .[-1].open = false else . end)
                        | map({from, until: (.to + $step), duration: (.to - .from + $step)})) as $runs
                       | ($runs | map(.duration) | add // 0) as $total
                       | {above: {
                           total: $total, total_text: ($total | hm),
                           share: ($total / (($p | length) * $step)),
                           first: ($runs[0].from // null | if . then clk($oneday) else null end),
                           longest: ($runs | max_by(.duration) // null
                                     | if . then {from: (.from | clk($oneday)), until: (.until | clk($oneday)), duration, text: (.duration | hm)} else null end),
                           stretches: ($runs | length)}}
                     end
                 end
               | .trust = (if .broken or .warning != "" then 2 elif .off_share >= 0.05 then 1 else 0 end) ]
             | sort_by(.trust, -(.above.total // -1), -(.max.value // -1e308))
      }
    | if $thr == null then . else .crossing = ([ .vms[] | select((.above.total // 0) > 0) ] | length) end
    | .vms |= .[:$params.top]
  render: |
    {{ .analyzed }} VM(s): {{ param "signal" }} forecast for {{ .from }}..{{ .to }} UTC from {{ param "range" }} of history to {{ param "at" }} (window {{ param "window" }}, method {{ param "method" }}){{ if .skipped }}; {{ len .skipped }} skipped{{ end }}.{{ if hasKey . "threshold" }} Above {{ .threshold }} within the interval: {{ .crossing }} VM(s).{{ end }}
    {{ range .vms }}{{ .instance }}: {{ if hasKey . "reason" }}no forecast: {{ .reason }}
    {{ else }}mean {{ printf "%.3g" (float64 .mean) }}, {{ printf "%.3g" (float64 .first) }} at the start, {{ printf "%.3g" (float64 .last) }} at the end; min {{ printf "%.3g" (float64 .min.value) }} at {{ .min.time }}, max {{ printf "%.3g" (float64 .max.value) }} at {{ .max.time }}; actual values scatter by about +-{{ printf "%.2g" (float64 .noise_sd) }} around it (noise, not the model error).
      profile ({{ .bucket }} means): {{ range $i, $b := .profile }}{{ if $i }} | {{ end }}{{ $b.time }} {{ printf "%.3g" (float64 $b.mean) }}{{ end }}
    {{ if hasKey . "above" }}{{ with .above }}  {{ if gt (float64 .total) 0.0 }}above {{ $.threshold }}: {{ .total_text }} in total ({{ printf "%.0f" (mulf 100 (float64 .share)) }}% of the interval) in {{ .stretches }} stretch(es), first at {{ .first }}, longest {{ .longest.from }}..{{ .longest.until }} ({{ .longest.text }}){{ else }}never above {{ $.threshold }} in the interval{{ end }}
    {{ end }}{{ end }}{{ range .jobs }}  a scheduled job SSA leaves out: ~{{ .time_of_day }} UTC ±{{ .spread }}, ~{{ .duration }}, {{ if lt (float64 .deviation) 0.0 }}below{{ else }}above{{ end }} the profile by {{ printf "%.3g" (float64 .deviation) }} (seen on {{ .days }}/{{ .of_days }} days), expected at {{ join ", " .at }}
    {{ end }}{{ end }}{{ if .left_out }}  forecast of {{ .forecast_of }} without {{ join "," .left_out }} (no stable continuation)
    {{ end }}{{ if .growing }}  left out as growing (a weak oscillation whose amplitude changed within the history; continuing it would multiply its error): {{ join "; " .growing }}
    {{ end }}{{ if .regime }}  do not trust it: the history has another regime ({{ join "; " .regime }}); re-run with at/range outside it
    {{ end }}{{ if .warning }}  warning: {{ .warning }}
    {{ end }}{{ end }}
