# Template: rest worker, GET with optional query filters (an item that renders
# empty is not sent) → jq → render. Active alerts from the Alertmanager API v2.
# The base URL (e.g. http://alertmanager:9093/api/v2) and credentials live in the
# rest instance of the server config; the tool gives only the path. Adapt: the
# instance name, the path, the query and the jq over the API's response.
name: alertmanager_alerts
description: |
  Alerts currently known to Alertmanager (API v2), optionally only one
  alertname or severity. By default only active alerts that are neither
  silenced nor inhibited, i.e. the ones that notify; `include_muted` adds the
  silenced and inhibited ones. Returns how many alerts matched and, per
  alert, its name, severity, state, the main labels, summary, start time and
  the silences muting it, newest first, capped at `top`. An empty list means
  nothing matched. Use it to see what Alertmanager is notifying about right
  now; to create a silence use a silence tool.
worker: rest

params:
  alertname:     {type: string, default: "", description: "Exact alertname, e.g. KubePodCrashLooping (empty = any)", pattern: "^[A-Za-z0-9_:.-]*$"}
  severity:      {type: string, default: "", description: "Exact severity label, e.g. critical (empty = any)", pattern: "^[A-Za-z0-9_-]*$"}
  include_muted: {type: boolean, default: false, description: "Also return silenced and inhibited alerts"}
  top:           {type: integer, default: 30, minimum: 1, maximum: 500, description: "How many alerts to return"}

request:
  method: GET
  path: /alerts
  query:
    active: true
    silenced: "{{ .include_muted }}"
    inhibited: "{{ .include_muted }}"
    filter: ['{{ if .alertname }}alertname="{{ .alertname }}"{{ end }}', '{{ if .severity }}severity="{{ .severity }}"{{ end }}']

response:
  jq: |
    [ .[]
      | {alertname: .labels.alertname,
         severity: (.labels.severity // null),
         state: .status.state,
         labels: (.labels | with_entries(select(.key | IN("namespace", "pod", "instance", "job", "service", "cluster")))),
         summary: (.annotations.summary // .annotations.description // null),
         starts_at: .startsAt,
         silenced_by: (.status.silencedBy // [])} ] as $alerts
    | {matched: ($alerts | length), alerts: ($alerts | sort_by(.starts_at) | reverse | .[:$params.top])}
  render: |
    {{ if eq (int .matched) 0 }}No {{ if param "include_muted" }}{{ else }}notifying {{ end }}alerts{{ with param "alertname" }} named {{ . }}{{ end }}{{ with param "severity" }} with severity {{ . }}{{ end }}.{{ else -}}
    {{ .matched }} alert(s){{ with param "alertname" }} named {{ . }}{{ end }}{{ with param "severity" }} with severity {{ . }}{{ end }}{{ if lt (len .alerts) (int .matched) }}, newest {{ len .alerts }} shown{{ end }}:
    {{ range .alerts }}- {{ .alertname }} [{{ .severity | default "no severity" }}, {{ .state }}] since {{ .starts_at }}{{ range $k, $v := .labels }} {{ $k }}={{ $v }}{{ end }}{{ with .summary }}: {{ . }}{{ end }}{{ if .silenced_by }} (silenced by {{ join ", " .silenced_by }}){{ end }}
    {{ end }}{{ end }}
