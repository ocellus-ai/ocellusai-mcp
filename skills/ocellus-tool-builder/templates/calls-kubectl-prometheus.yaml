# Template: calls — kubectl lists the pods (per-call jq returns a flat list), then
# Prometheus is asked about exactly those pods (regex built from the first result),
# response.jq joins both by pod name. Adapt: the first source and its flat shape,
# the metric of the second call, the join key.
name: pods_memory_status
description: |
  Kubernetes status (phase, restarts, node) together with the current memory
  working set of the pods of a namespace, optionally filtered by a label
  selector. Lists the pods with kubectl, then queries Prometheus (cAdvisor
  container_memory_working_set_bytes) for exactly those pods and joins both
  by pod name. Returns [{pod, phase, restarts, node, memory_bytes}], largest
  memory first; memory_bytes is null for a pod Prometheus has no samples for
  yet. Needs both kubectl access and Prometheus; with only one of them use a
  kubectl-only or a Prometheus-only tool.

params:
  namespace: {type: string, required: true, description: "Kubernetes namespace, e.g. prod", pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"}
  selector:  {type: string, default: "", description: "Label selector such as app=api (empty = all pods)", pattern: "^([A-Za-z0-9._/][A-Za-z0-9._/=!,() -]*)?$"}

calls:
  - name: pods
    worker: shell
    request:
      command: kubectl
      args: [get, pods, -n, "{{ .namespace }}", -l, "{{ .selector }}", -o, json]
      parse: json
      timeout: 20s
    jq: |
      [.items[] | {
        pod: .metadata.name,
        phase: .status.phase,
        node: (.spec.nodeName // null),
        restarts: ([.status.containerStatuses[]?.restartCount] | add // 0)
      }]
  - name: mem
    worker: prometheus
    request:
      type: instant
      query: |
        {{- $names := list }}{{ range result "pods" }}{{ $names = append $names (promRegex .pod) }}{{ end -}}
        sum by (pod) (container_memory_working_set_bytes{
          namespace={{ promLabel .namespace }},
          pod=~{{ promLabel (join "|" $names | default "__none__") }},
          container!=""
        })

response:
  jq: |
    (.mem.result | map({key: .metric.pod, value: (.value[1] | tonumber? // null)}) | from_entries) as $mem
    | [.pods[] | . + {memory_bytes: $mem[.pod]}]
    | sort_by(-(.memory_bytes // -1))
  render: |
    {{- define "bytes" }}{{ if kindIs "invalid" . }}n/a{{ else }}{{ $v := float64 . }}{{ if ge $v 1073741824.0 }}{{ printf "%.2f GiB" (divf $v 1073741824.0) }}{{ else }}{{ printf "%.0f MiB" (divf $v 1048576.0) }}{{ end }}{{ end }}{{ end -}}
    {{ if not . }}No pods in namespace {{ param "namespace" }}{{ with param "selector" }} matching {{ . }}{{ end }}.{{ else -}}
    {{ len . }} pod(s) in {{ param "namespace" }}{{ with param "selector" }} matching {{ . }}{{ end }}, memory working set now:
    {{ range . }}- {{ .pod }}: {{ .phase }}, {{ .restarts }} restart(s), node {{ .node | default "-" }}, {{ template "bytes" .memory_bytes }}
    {{ end }}{{ end }}
