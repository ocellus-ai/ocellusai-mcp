# join + anomaly_ensemble example — two range queries, joined per VM into one
# multivariate series by the join transform, the tsanomaly detector ensemble
# (Matrix Profile, AR residual, Isolation Forest, PCA, k-dim Matrix Profile)
# with POT thresholds over the (cpu, mem) series, and a level-2 response.
name: vm_anomaly_ensemble
description: |
  Finds anomalous time segments in the joint CPU+memory behaviour of each VM
  (node exporter instance) over the last `range`: shape changes, spikes and
  drops, rare states, and samples where the usual relation between CPU and
  memory breaks. Thresholds adapt to each VM's own noise (extreme-value
  theory with a per-sample false-positive `risk`), so a quiet VM and a busy
  one are judged on their own scale. Returns, per VM with anomalies, the
  segments with start/end/peak time, a kind (single: one metric is anomalous
  by itself; correlation: no metric is anomalous alone but their relation
  broke; systemic: several metrics are anomalous) and the metrics that drive
  each segment with their evidence. Lower `risk` to keep only the strongest
  segments; `window` is the typical duration of a shape to compare (an hour
  for 1m samples).
params:
  instance: {type: string, default: ".*", description: "Regex over the instance label, e.g. vm-1.*:9100"}
  range:    {type: string, default: "12h", pattern: "^[0-9]+[smhdwy]$", description: "Look-back range such as 6h, 2d"}
  step:     {type: string, default: "60s", pattern: "^[0-9]+[smhdwy]$", description: "Sample resolution such as 30s, 5m"}
  window:   {type: string, default: "1h", pattern: "^[0-9]+[smhdwy]$", description: "Length of a shape to compare, e.g. 1h; segments much shorter than a quarter of it are diluted"}
  risk:     {type: number, default: 0.0001, minimum: 0.000001, maximum: 0.1, description: "Expected false positives per sample and detector (POT); lower is stricter"}
  top:      {type: integer, default: 10, minimum: 1, maximum: 200, description: "How many VMs to list, most anomalous first"}

calls:
  - name: cpu
    worker: prometheus
    request:
      type: range
      query: |
        100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle", instance=~{{ promLabel .instance }}}[5m])))
      start: "now-{{ promDuration .range }}"
      end: now
      step: "{{ .step }}"
  - name: mem
    worker: prometheus
    request:
      type: range
      query: |
        100 * (1 - node_memory_MemAvailable_bytes{instance=~{{ promLabel .instance }}}
                 / node_memory_MemTotal_bytes{instance=~{{ promLabel .instance }}})
      start: "now-{{ promDuration .range }}"
      end: now
      step: "{{ .step }}"

process:
  - fn: join                         # {cpu: matrix, mem: matrix} → one (cpu, mem) series per instance
    with:
      inputs: [cpu, mem]
      join_by: [instance]
  - fn: anomaly_ensemble
    with:
      window: "{{ .window }}"        # points or a duration; resolved at the series' step
      risk: "{{ .risk }}"
      min_len: 2                     # drop one-sample segments
      min_points: 60                 # a VM with fewer samples is skipped
      max_ranges: 10
      top_metrics: 2

response:
  jq: |
    {
      total: .total_anomalies,
      vms_analyzed: .series_analyzed,
      vms_skipped: .series_skipped,
      vms: [ .series[] | select(.skipped | not) | select(.anomaly_count > 0)
             | {instance: .labels.instance, count: .anomaly_count, window: .window, max_score: .max_score,
                anomalies: [.anomalies[] | {start_time, end_time, peak_time, points, kind, score, fired_by,
                                            mem: .values.mem, mem_baseline: .baseline.mem,
                                            top: [.top_metrics[] | {metric, score, own_z, pca_share, mp_share}]}]} ]
           | sort_by(-.count, -.max_score) | .[:$params.top]
    }
  render: |
    {{ if eq (int .total) 0 }}No joint CPU/memory anomalies for instance {{ param "instance" }} over the last {{ param "range" }} ({{ .vms_analyzed }} VM(s) analyzed, {{ .vms_skipped }} skipped).{{ else }}
    {{ .total }} anomalous segment(s) over the last {{ param "range" }} ({{ .vms_analyzed }} VM(s) analyzed, {{ .vms_skipped }} skipped; window {{ param "window" }}, risk {{ param "risk" }}):
    {{ range .vms }}{{ .instance }}: {{ .count }} segment(s), max score {{ printf "%.1f" (float64 .max_score) }}
    {{ range .anomalies }}  - {{ .start_time }} .. {{ .end_time }} ({{ .points }} samples, {{ .kind }}, score {{ printf "%.1f" (float64 .score) }}; fired by {{ join ", " .fired_by }}), driven by {{ (index .top 0).metric }} (own z {{ printf "%.1f" (float64 (index .top 0).own_z) }}, PCA share {{ printf "%.2f" (float64 (index .top 0).pca_share) }}); mem {{ printf "%.1f" (float64 .mem) }}% at the peak vs {{ printf "%.1f" (float64 .mem_baseline) }}% usually
    {{ end }}{{ end }}{{ end }}
